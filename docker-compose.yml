services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dodo_invoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dodo_invoice
      PSP_BASE_URL: http://localhost:3001
      PORT: 3000
      PSP_PORT: 3001
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: